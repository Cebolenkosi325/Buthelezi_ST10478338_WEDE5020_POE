<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bread, Cakes and Pastries | Sunrise Bakery Products</title>
    <meta name="description" content="Search the fresh bread, custom cakes and pastries baked daily at Sunrise Bakery in Centurion, Gauteng. Filter by category and sort by price.">
    <meta name="keywords" content="bread, cakes, pastries, cupcakes, croissants, muffins, doughnuts, Centurion bakery">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Sunrise Bakery</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="product.html">Products</a>
            <a href="enquiry.html">Enquiry</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>

        <section class="menu">
            <h2>Our Menu</h2>
            <p>Search our products, choose a category or change the order.</p>

            <!-- Search, filter and sort controls -->
            <div class="menu-tools">
                <div>
                    <label for="searchBox">Search:</label>
                    <input type="search" id="searchBox" placeholder="Try croissant or chocolate">
                </div>

                <div>
                    <label for="categoryFilter">Category:</label>
                    <select id="categoryFilter">
                        <option value="all">All products</option>
                        <option value="Bread">Bread</option>
                        <option value="Cakes">Cakes</option>
                        <option value="Pastries">Pastries</option>
                    </select>
                </div>

                <div>
                    <label for="sortBox">Sort by:</label>
                    <select id="sortBox">
                        <option value="name">Name (A to Z)</option>
                        <option value="low">Price (low to high)</option>
                        <option value="high">Price (high to low)</option>
                    </select>
                </div>
            </div>

            <p id="resultCount" class="result-count" aria-live="polite"></p>

            <!-- JavaScript puts the product cards in here -->
            <div id="productList" class="product-list"></div>

            <noscript>
                <p>Please turn on JavaScript to see the product list. We bake bread, cakes and pastries fresh every day.</p>
            </noscript>
        </section>

    </main>

    <footer>
        <p>123 Main Street, Centurion, Gauteng</p>
        <p>Phone: 012 345 6789</p>
        <p>Opening Hours: Mon-Fri 7:00 AM - 6:00 PM</p>
        <p>Facebook | Instagram</p>
    </footer>

    <script src="js/products.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
